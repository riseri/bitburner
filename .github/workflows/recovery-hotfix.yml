name: Recovery hotfix
on:
  push:
    branches: [fix/recovery-safety-drain]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/daemon.js')
          s=p.read_text()
          a=s.index('function consumeEvents(\n')
          b=s.index('function findOverdueBatch(\n',a)
          x=s[a:b]
          if '"drain"' not in x: raise SystemExit('no safety drains found')
          x=x.replace('"drain"','"recover"')
          s=s[:a]+x+s[b:]
          marker='''\t\t\t\t\t\t\tkind:\n\t\t\t\t\t\t\t\t"drain",\n\t\t\t\t\t\t\tafterKind:\n\t\t\t\t\t\t\t\t"resync",\n\t\t\t\t\t\t\tbumpGap:\n\t\t\t\t\t\t\t\ttrue,\n'''
          if marker in s:
              s=s.replace(marker,'''\t\t\t\t\t\t\tkind:\n\t\t\t\t\t\t\t\t"recover",\n''',1)
          p.write_text(s)
          PY
          cp src/daemon.js /tmp/daemon.mjs
          node --check /tmp/daemon.mjs
          git diff --check
          git config user.name github-actions
          git config user.email github-actions@github.com
          git rm .github/workflows/recovery-hotfix.yml
          git add src/daemon.js
          git commit -m "Keep safety faults in local recovery [skip ci]"
          git push
