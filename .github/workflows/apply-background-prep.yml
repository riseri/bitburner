name: Apply tested background prep
on:
  push:
    branches: [feature/protected-background-prep]
permissions:
  contents: write
jobs:
  apply:
    if: contains(github.event.head_commit.message, 'Stage tested protected background prep')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and verify the locally tested source
        run: |
          # Normalize only the patch header separator, never runtime source.
          sed -i 's/^ diff --git /diff --git /' .github/background-prep.patch
          git apply --check .github/background-prep.patch
          git apply .github/background-prep.patch
          python3 - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/jit-tests.yml': '4446e525cb02e5010683295579e06a22cdba87fd',
              'package.json': '9863e3f64ecfb7e04d75f1b1e9ec6ee31509799a',
              'src/daemon.js': 'd46a833061bf5e9fe84d7c9e5569c02a4bcd2c35',
              'src/fleet-manager.js': 'fbc1de1032238e5f4b198f3e3e10fbaba474b102',
              'src/supervisor.js': '8585992b0afa061b43f0a2133ec22cedd32a0c18',
              'test/helpers.cjs': '21297a84f35cea21b07a24fbdd7d5f260d3d9b37',
              'test/simulator.cjs': 'c4a51a80c6607243e8e677c45982ed1e3fc5ad76',
              'src/lib/background-prep.js': 'ad88914ac52dbc3f0e3f514046c77afa77403ad4',
              'src/background-grow.js': 'fd12b9abe9c563f280834245d266a4e6c240b7c6',
              'src/background-weaken.js': 'f0790a1b3e0391948e64f021b676b0c6b7234dca',
              'test/background-prep.test.cjs': 'c4c819a93198cd8f1918941b3dd6f44f78f5aac2',
              'test/background-prep-simulation.test.cjs': '24ac50cbe9551803dd3886247e737f1bce91a146',
              'docs/background-prep.md': 'c04dbf3de86306e0198663af6bcda7af06a0128b',
          }
          for path, sha in expected.items():
              actual = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              if actual != sha:
                  raise SystemExit(f'Content mismatch: {path}: {actual} != {sha}')
          print('All 13 files match the locally tested source')
          PY
      - name: Regression tests and concurrent simulations
        run: npm test
      - name: Commit only tested runtime changes to the review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Workflow edits are published separately through the authorized repository connection.
          git restore .github/workflows/jit-tests.yml
          git rm -f .github/background-prep.patch .github/workflows/apply-background-prep.yml
          git add src test docs package.json
          git diff --cached --check
          git commit -m 'Prepare one richer target while protecting active JIT income'
          git push origin HEAD:feature/protected-background-prep
