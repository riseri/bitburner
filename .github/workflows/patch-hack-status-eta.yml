name: Patch hack status ETA

on:
  push:
    branches: [fix/hack-status-eta]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch dynamic hack ETA
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/daemon.js')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'Expected snippet not found: {label}')
              text = text.replace(old, new, 1)

          replace_once(
              '''\t\t\t\treservations,\n\t\t\t\ttargetAnalysis,''',
              '''\t\t\t\treservations,\n\t\t\t\tbatches,\n\t\t\t\ttargetAnalysis,''',
              'renderDashboard call',
          )

          replace_once(
              '''\treservations,\n\ttargetAnalysis,''',
              '''\treservations,\n\tbatches,\n\ttargetAnalysis,''',
              'renderDashboard signature',
          )

          marker = '''function renderDashboard(\n'''
          helper = '''function nextPendingHackLanding(batches) {\n\tlet next = Infinity;\n\n\tfor (const batch of batches.values()) {\n\t\tconst phase =\n\t\t\tbatch.phases?.H;\n\n\t\tif (\n\t\t\t!phase ||\n\t\t\tphase.complete ||\n\t\t\tphase.skipped\n\t\t) {\n\t\t\tcontinue;\n\t\t}\n\n\t\tconst landing =\n\t\t\tNumber(\n\t\t\t\tbatch.landing?.H\n\t\t\t);\n\n\t\tif (\n\t\t\tNumber.isFinite(landing)\n\t\t) {\n\t\t\tnext =\n\t\t\t\tMath.min(\n\t\t\t\t\tnext,\n\t\t\t\t\tlanding\n\t\t\t\t);\n\t\t}\n\t}\n\n\treturn next;\n}\n\nfunction renderDashboard(\n'''
          replace_once(marker, helper, 'pending hack helper')

          replace_once(
              '''\tconst hackStatus =\n\t\tNumber.isFinite(\n\t\t\tstats.lastHackAt\n\t\t)\n\t\t\t? "LIVE"\n\t\t\t: Number.isFinite(\n\t\t\t\tstats.nextHackLanding\n\t\t\t)\n\t\t\t\t? `ETA ${formatTime(\n\t\t\t\t\tMath.max(\n\t\t\t\t\t\t0,\n\t\t\t\t\t\tstats.nextHackLanding -\n\t\t\t\t\t\tnow\n\t\t\t\t\t)\n\t\t\t\t)}`\n\t\t\t\t: "n/a";''',
              '''\tconst pendingHackLanding =\n\t\tnextPendingHackLanding(\n\t\t\tbatches\n\t\t);\n\n\tconst hackStatus =\n\t\tNumber.isFinite(\n\t\t\tstats.lastHackAt\n\t\t)\n\t\t\t? "LIVE"\n\t\t\t: Number.isFinite(\n\t\t\t\tpendingHackLanding\n\t\t\t)\n\t\t\t\t? pendingHackLanding > now\n\t\t\t\t\t? `ETA ${formatTime(\n\t\t\t\t\t\tpendingHackLanding - now\n\t\t\t\t\t)}`\n\t\t\t\t\t: `DUE +${formatTime(\n\t\t\t\t\t\tnow - pendingHackLanding\n\t\t\t\t\t)}`\n\t\t\t\t: "WAITING";''',
              'hack status rendering',
          )

          path.write_text(text)
          PY

      - name: Validate daemon
        shell: bash
        run: |
          cp src/daemon.js /tmp/daemon.mjs
          node --check /tmp/daemon.mjs
          git diff --check

      - name: Commit patch and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-hack-status-eta.yml
          git add src/daemon.js
          git commit -m "Fix stale hack status ETA [skip ci]"
          git push origin HEAD:fix/hack-status-eta
