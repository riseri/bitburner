name: Reset scheduler source snapshot
on:
  push:
    branches: [fix/post-augment-scheduler-liveness]
permissions:
  contents: read
jobs:
  snapshot:
    if: startsWith(github.event.head_commit.message, 'Capture pinned source')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 32db42d26a5b923661ef6e9253f504c4143f71fc
          persist-credentials: false
      - name: Archive pinned source
        run: git archive --format=tar HEAD > reset-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: reset-source
          path: reset-source.tar
          retention-days: 1
