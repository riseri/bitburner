name: Native IPvGO benchmark
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/go-bot.js'
      - 'src/lib/go-*.js'
      - 'test/go*'
      - 'test/native-go/**'
      - '.github/workflows/go-native-benchmark.yml'
permissions:
  contents: read
jobs:
  native-go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: bitburner-official/bitburner-src
          ref: f02059a6769b6e20c6f1b32178a581801779b1f3
          path: native-upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Paired native Daedalus benchmark, fixed work
        run: node --experimental-vm-modules --disable-warning=ExperimentalWarning test/go-native-benchmark.cjs --upstream native-upstream --output go-benchmark-fixed.json
      - name: Paired native Daedalus benchmark, production CPU cap
        run: node --experimental-vm-modules --disable-warning=ExperimentalWarning test/go-native-benchmark.cjs --upstream native-upstream --games 20 --capped --output go-benchmark-capped.json
      - name: Benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-native-report
          retention-days: 7
          path: |
            go-benchmark-fixed.json
            go-benchmark-capped.json
