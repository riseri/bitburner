name: Hotfix prep reaper

on:
  push:
    branches: [fix/prep-reaper-regression]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore prep-only reaper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/daemon.js')
          text = path.read_text()

          marker = '''function reconcileRunning(\n\tns,\n\trunning,\n\trunningByChunk,\n\tlimit\n) {\n'''
          if text.count(marker) != 1:
              raise SystemExit(f'expected one reconcileRunning marker, found {text.count(marker)}')

          helper = '''// Prep waves are intentionally simple and are not latency-sensitive.\n// Keep their small running set exact without bringing the full PID sweep back\n// into the live JIT scheduler.\nfunction reapRunning(\n\tns,\n\trunning\n) {\n\tfor (const [pid, chunk] of running) {\n\t\tif (ns.isRunning(pid)) {\n\t\t\tcontinue;\n\t\t}\n\n\t\tuntrackRunning(\n\t\t\trunning,\n\t\t\tpid,\n\t\t\tchunk\n\t\t);\n\t}\n}\n\n'''

          text = text.replace(marker, helper + marker, 1)
          path.write_text(text)
          PY

      - name: Validate daemon
        shell: bash
        run: |
          cp src/daemon.js /tmp/daemon.mjs
          node --check /tmp/daemon.mjs
          git diff --check

      - name: Commit hotfix and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/hotfix-prep-reaper.yml
          git add src/daemon.js
          git commit -m "Restore prep worker reaping [skip ci]"
          git push origin HEAD:fix/prep-reaper-regression
