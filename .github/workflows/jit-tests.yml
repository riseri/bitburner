name: JIT regression tests
on:
  push:
    branches: [main, fix/jit-recovery-invariants, feature/protected-background-prep]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: All regression tests and full daemon simulations
        run: npm test
