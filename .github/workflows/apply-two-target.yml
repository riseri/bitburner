name: Verify final two-target isolation
on:
  push:
    branches: [feature/two-target-jit]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == 'Finalize two-target prep isolation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply checked prep ownership guard
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          path = Path('src/lib/target-pipelines.js')
          text = path.read_text()
          def blob(value):
              raw = value.encode('utf-8')
              return hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest()
          assert blob(text) == '52515354941d3ce3e3766297ec6ffbf6487539ef'
          before = '\tif (p.drain) {\n\t\tif (p.repair?.active) cancelBackgroundPrep(ns, p.repair, "target is draining");'
          after = '\tif ((p.recovery || p.drain) && pool.cfg.backgroundPrep?.active) {\n\t\tcancelBackgroundPrep(ns, pool.cfg.backgroundPrep, "earning target recovery has priority");\n\t}\n' + before
          assert text.count(before) == 1
          text = text.replace(before, after, 1)
          assert blob(text) == '5aed2dff53c428476d60b53b212c5e4de967a50b'
          path.write_text(text)
          PY
      - name: Complete regression and simulation suite
        run: npm test
      - name: Commit verified ownership guard
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/target-pipelines.js
          git commit -m 'Yield optional preparation during target-local recovery'
          git push origin HEAD:feature/two-target-jit
