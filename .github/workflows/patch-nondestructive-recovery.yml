name: Patch non-destructive recovery

on:
  push:
    branches: [fix/non-destructive-recovery]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch daemon recovery policy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/daemon.js')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'const PLANNING_LAUNCH_GUARD_MS = 20;\n',
              'const PLANNING_LAUNCH_GUARD_MS = 20;\nconst SOFT_RECOVERY_MS = 2_000;\nconst SOFT_RECOVERY_MAX_MS = 15_000;\n',
              'soft recovery constants',
          )

          replace_once(
              '\t\t["fleet-port", 19],\n',
              '\t\t["fleet-port", 19],\n\t\t["control-port", 18],\n',
              'control port flag',
          )

          replace_once(
              '\t\tfleetPort: Number(flags["fleet-port"]),\n',
              '\t\tfleetPort: Number(flags["fleet-port"]),\n\t\tcontrolPort: Number(flags["control-port"]),\n',
              'control port config',
          )

          replace_once(
              '''\tconst fleetPort = ns.getPortHandle(cfg.fleetPort);\n\tfleetPort.clear();\n''',
              '''\tconst fleetPort = ns.getPortHandle(cfg.fleetPort);\n\tfleetPort.clear();\n\n\tconst controlPort = ns.getPortHandle(cfg.controlPort);\n\tcontrolPort.clear();\n\tpublishHackPause(controlPort, 0, "startup");\n''',
              'control port init',
          )

          replace_once(
              '''\tlet maintenance = null;\n\tlet drain = null;\n''',
              '''\tlet maintenance = null;\n\tlet drain = null;\n\tlet recovery = null;\n''',
              'recovery state',
          )

          old_event = '''\t\tif (eventProblem) {\n\t\t\tif (\n\t\t\t\teventProblem.kind ===\n\t\t\t\t"drain"\n\t\t\t) {\n\t\t\t\tconst result =\n\t\t\t\t\tbeginDrain(\n\t\t\t\t\t\tdrain,\n\t\t\t\t\t\teventProblem,\n\t\t\t\t\t\tqueue,\n\t\t\t\t\t\tbatches,\n\t\t\t\t\t\tstats,\n\t\t\t\t\t\tcfg\n\t\t\t\t\t);\n\n\t\t\t\tdrain =\n\t\t\t\t\tresult.drain;\n\n\t\t\t\tqueue =\n\t\t\t\t\tresult.queue;\n\t\t\t} else if (!maintenance) {\n\t\t\t\tmaintenance =\n\t\t\t\t\teventProblem;\n\t\t\t}\n\t\t}\n'''
          new_event = '''\t\tif (eventProblem) {\n\t\t\tif (\n\t\t\t\teventProblem.kind ===\n\t\t\t\t"recover" &&\n\t\t\t\t!drain &&\n\t\t\t\t!maintenance\n\t\t\t) {\n\t\t\t\trecovery = beginSoftRecovery(\n\t\t\t\t\trecovery,\n\t\t\t\t\teventProblem,\n\t\t\t\t\tcontrolPort,\n\t\t\t\t\truntime,\n\t\t\t\t\tstats\n\t\t\t\t);\n\t\t\t} else if (\n\t\t\t\teventProblem.kind ===\n\t\t\t\t"drain"\n\t\t\t) {\n\t\t\t\tconst result =\n\t\t\t\t\tbeginDrain(\n\t\t\t\t\t\tdrain,\n\t\t\t\t\t\teventProblem,\n\t\t\t\t\t\tqueue,\n\t\t\t\t\t\tbatches,\n\t\t\t\t\t\tstats,\n\t\t\t\t\t\tcfg\n\t\t\t\t\t);\n\n\t\t\t\tdrain =\n\t\t\t\t\tresult.drain;\n\n\t\t\t\tqueue =\n\t\t\t\t\tresult.queue;\n\t\t\t} else if (!maintenance) {\n\t\t\t\tmaintenance =\n\t\t\t\t\teventProblem;\n\t\t\t}\n\t\t}\n\n\t\tif (\n\t\t\trecovery &&\n\t\t\t!drain &&\n\t\t\t!maintenance\n\t\t) {\n\t\t\tconst recoveryState = updateSoftRecovery(\n\t\t\t\tns,\n\t\t\t\ttarget,\n\t\t\t\trecovery,\n\t\t\t\tcontrolPort,\n\t\t\t\truntime,\n\t\t\t\tstats\n\t\t\t);\n\n\t\t\trecovery = recoveryState.recovery;\n\n\t\t\tif (recoveryState.problem) {\n\t\t\t\tconst result = beginDrain(\n\t\t\t\t\tdrain,\n\t\t\t\t\trecoveryState.problem,\n\t\t\t\t\tqueue,\n\t\t\t\t\tbatches,\n\t\t\t\t\tstats,\n\t\t\t\t\tcfg\n\t\t\t\t);\n\n\t\t\t\tdrain = result.drain;\n\t\t\t\tqueue = result.queue;\n\t\t\t}\n\t\t}\n'''
          replace_once(old_event, new_event, 'event recovery dispatch')

          replace_once(
              '''\t\t\t!maintenance &&\n\t\t\t!drain &&\n\t\t\tloopNow -\n\t\t\tlastOverdueCheck >=\n''',
              '''\t\t\t!maintenance &&\n\t\t\t!drain &&\n\t\t\t!recovery &&\n\t\t\tloopNow -\n\t\t\tlastOverdueCheck >=\n''',
              'skip overdue during local recovery',
          )

          replace_once(
              '''\t\t\tconst deferredRetuneReady =\n\t\t\t\t!drain &&\n''',
              '''\t\t\tconst deferredRetuneReady =\n\t\t\t\t!drain &&\n\t\t\t\t!recovery &&\n''',
              'skip deferred retune during recovery',
          )

          replace_once(
              '''\t\t\t!maintenance &&\n\t\t\t!drain &&\n\t\t\thackingLevel >=\n''',
              '''\t\t\t!maintenance &&\n\t\t\t!drain &&\n\t\t\t!recovery &&\n\t\t\thackingLevel >=\n''',
              'skip level retune during recovery',
          )

          replace_once(
              '''\t\tif (maintenance) {\n\t\t\tif (\n''',
              '''\t\tif (maintenance) {\n\t\t\trecovery = null;\n\t\t\tpublishHackPause(controlPort, 0, "maintenance");\n\n\t\t\tif (\n''',
              'clear local recovery on maintenance',
          )

          replace_once(
              '''\t\t\t\tcloudState,\n\t\t\t\tdrain,\n\t\t\t\tforeignUsedByHost\n''',
              '''\t\t\t\tcloudState,\n\t\t\t\tdrain,\n\t\t\t\trecovery,\n\t\t\t\tforeignUsedByHost\n''',
              'dashboard recovery arg',
          )

          replace_once(
              '''\t\t\t\tchunk.chunkId,\n\t\t\t\tmaxLate\n\t\t\t);\n''',
              '''\t\t\t\tchunk.chunkId,\n\t\t\t\tmaxLate,\n\t\t\t\tcfg.controlPort\n\t\t\t);\n''',
              'control port worker arg',
          )

          replace_once(
              '''\t\trecoveries: 0,\n\n\t\tcancelledHackChunks: 0,\n''',
              '''\t\trecoveries: 0,\n\n\t\tsoftRecoveries: 0,\n\t\tsoftRecoveryExtensions: 0,\n\t\tsoftRecoverySuccesses: 0,\n\t\tsuppressedHackChunks: 0,\n\n\t\tcancelledHackChunks: 0,\n''',
              'lifetime soft recovery stats',
          )

          replace_once(
              '''\t\trecoveries: 0,\n\t\tmisses: { H: 0, W1: 0, G: 0, W2: 0 },\n''',
              '''\t\trecoveries: 0,\n\t\tsoftRecoveries: 0,\n\t\tsuppressedHackChunks: 0,\n\t\tmisses: { H: 0, W1: 0, G: 0, W2: 0 },\n''',
              'pipeline soft recovery stats',
          )

          replace_once(
              '''\ttargetAnalysis,\n\tcloudState,\n\tdrain,\n\tforeignUsedByHost\n''',
              '''\ttargetAnalysis,\n\tcloudState,\n\tdrain,\n\trecovery,\n\tforeignUsedByHost\n''',
              'dashboard signature recovery arg',
          )

          replace_once(
              '''\tconst hackStatus =\n\t\tNumber.isFinite(\n\t\t\tstats.lastHackAt\n\t\t)\n''',
              '''\tconst hackStatus =\n\t\trecovery\n\t\t\t? `PAUSED ${formatTime(\n\t\t\t\tMath.max(0, recovery.pauseUntil - now)\n\t\t\t)}`\n\t\t\t: Number.isFinite(\n\t\t\t\tstats.lastHackAt\n\t\t\t)\n''',
              'paused hack status',
          )

          # The preceding replacement adds one nesting level to the existing ternary.
          replace_once(
              '''\t\t\t? "LIVE"\n\t\t\t: Number.isFinite(\n''',
              '''\t\t\t\t? "LIVE"\n\t\t\t\t: Number.isFinite(\n''',
              'hack status live indent',
          )

          replace_once(
              '''\t\tns.print(\n\t\t`State       ` +\n\t\t`${drain\n\t\t\t? `DRAINING :: ${drain.reason}`\n\t\t\t: "RUNNING"}`\n\t);\n''',
              '''\tns.print(\n\t\t`State       ` +\n\t\t`${drain\n\t\t\t? `DRAINING :: ${drain.reason}`\n\t\t\t: recovery\n\t\t\t\t? `RECOVERING :: ${recovery.reason}`\n\t\t\t\t: "RUNNING"}`\n\t);\n''',
              'dashboard state',
          )

          replace_once(
              '''\tns.print(\n\t\t`Recovery    ` +\n\t\t`${stats.recoveries} drain(s) ` +\n\t\t`| cancelled H chunks ${stats.cancelledHackChunks}`\n\t);\n''',
              '''\tns.print(\n\t\t`Recovery    ` +\n\t\t`${stats.softRecoveries} local ` +\n\t\t`| ${stats.softRecoverySuccesses} restored ` +\n\t\t`| H skips ${stats.suppressedHackChunks}`\n\t);\n\n\tns.print(\n\t\t`Fallback    ` +\n\t\t`${stats.recoveries} drain(s) ` +\n\t\t`| cancelled H chunks ${stats.cancelledHackChunks}`\n\t);\n''',
              'recovery dashboard lines',
          )

          # Add poisoned batch state and poison non-H skips.
          replace_once(
              '''\t\tmoneyEarned: 0,\n\n\t\tphases: {\n''',
              '''\t\tmoneyEarned: 0,\n\t\tpoisoned: false,\n\n\t\tphases: {\n''',
              'poisoned batch state',
          )

          replace_once(
              '''\tconst state =\n\t\tbatch.phases[phase];\n\n\tif (!state) {\n''',
              '''\tconst state =\n\t\tbatch.phases[phase];\n\n\tif (phase !== "H") {\n\t\tbatch.poisoned = true;\n\t}\n\n\tif (!state) {\n''',
              'poison skipped non-h phase',
          )

          # Insert soft recovery helpers before beginDrain.
          marker = 'function beginDrain(\n'
          helpers = '''function publishHackPause(\n\tport,\n\tpauseUntil,\n\treason\n) {\n\tport.clear();\n\tport.tryWrite({\n\t\ttype: "jit-control",\n\t\thackPauseUntil: Math.max(0, Number(pauseUntil) || 0),\n\t\treason: String(reason ?? ""),\n\t\tgeneratedAt: Date.now(),\n\t});\n}\n\nfunction beginSoftRecovery(\n\tcurrent,\n\tissue,\n\tcontrolPort,\n\truntime,\n\tstats\n) {\n\tconst now = Date.now();\n\tconst windowMs = Math.max(\n\t\tSOFT_RECOVERY_MS,\n\t\tMath.ceil(runtime.plan.period * 12)\n\t);\n\tconst checkLead = Math.min(\n\t\t500,\n\t\tMath.max(100, Math.ceil(runtime.plan.period * 2))\n\t);\n\n\tif (!current) {\n\t\tcurrent = {\n\t\t\treason: issue.reason,\n\t\t\tstarted: now,\n\t\t\tpauseUntil: now + windowMs,\n\t\t\tcheckAt: now + windowMs - checkLead,\n\t\t\tissues: 1,\n\t\t};\n\n\t\tstats.softRecoveries++;\n\t\tstats.pipeline.softRecoveries++;\n\t} else {\n\t\tcurrent.reason = issue.reason;\n\t\tcurrent.issues++;\n\t\tcurrent.pauseUntil = Math.max(\n\t\t\tcurrent.pauseUntil,\n\t\t\tnow + windowMs\n\t\t);\n\t\tcurrent.checkAt = current.pauseUntil - checkLead;\n\t\tstats.softRecoveryExtensions++;\n\t}\n\n\tstats.lastReason = `recovering: ${issue.reason}`;\n\tpublishHackPause(\n\t\tcontrolPort,\n\t\tcurrent.pauseUntil,\n\t\tcurrent.reason\n\t);\n\n\treturn current;\n}\n\nfunction updateSoftRecovery(\n\tns,\n\ttarget,\n\tcurrent,\n\tcontrolPort,\n\truntime,\n\tstats\n) {\n\tif (!current) {\n\t\treturn { recovery: null, problem: null };\n\t}\n\n\tconst now = Date.now();\n\tif (now < current.checkAt) {\n\t\treturn { recovery: current, problem: null };\n\t}\n\n\tconst maxMoney = ns.getServerMaxMoney(target);\n\tconst money = ns.getServerMoneyAvailable(target);\n\tconst minSec = ns.getServerMinSecurityLevel(target);\n\tconst sec = ns.getServerSecurityLevel(target);\n\tconst healthy =\n\t\tmoney >= maxMoney * 0.995 &&\n\t\tsec <= minSec + 0.02;\n\n\tif (healthy && now >= current.pauseUntil) {\n\t\tpublishHackPause(controlPort, 0, "recovered");\n\t\tstats.softRecoverySuccesses++;\n\t\tstats.lastReason = `recovered locally: ${current.reason}`;\n\t\treturn { recovery: null, problem: null };\n\t}\n\n\tif (healthy) {\n\t\tcurrent.checkAt = current.pauseUntil;\n\t\treturn { recovery: current, problem: null };\n\t}\n\n\tif (now - current.started >= SOFT_RECOVERY_MAX_MS) {\n\t\tpublishHackPause(controlPort, 0, "recovery timeout");\n\t\treturn {\n\t\t\trecovery: null,\n\t\t\tproblem: {\n\t\t\t\treason: `local recovery timed out: ${current.reason}`,\n\t\t\t\tkind: "drain",\n\t\t\t\tafterKind: "resync",\n\t\t\t\tresetPeriod: false,\n\t\t\t},\n\t\t};\n\t}\n\n\tconst windowMs = Math.max(\n\t\tSOFT_RECOVERY_MS,\n\t\tMath.ceil(runtime.plan.period * 12)\n\t);\n\tconst checkLead = Math.min(\n\t\t500,\n\t\tMath.max(100, Math.ceil(runtime.plan.period * 2))\n\t);\n\n\tcurrent.pauseUntil = now + windowMs;\n\tcurrent.checkAt = current.pauseUntil - checkLead;\n\tstats.softRecoveryExtensions++;\n\tpublishHackPause(\n\t\tcontrolPort,\n\t\tcurrent.pauseUntil,\n\t\tcurrent.reason\n\t);\n\n\treturn { recovery: current, problem: null };\n}\n\nfunction beginDrain(\n'''
          replace_once(marker, helpers, 'soft recovery helpers')

          # Patch consumeEvents as a scoped substring.
          start = text.index('function consumeEvents(\n')
          end = text.index('function findOverdueBatch(\n', start)
          part = text[start:end]

          skip_marker = '''\t\tif (\n\t\t\tevent.type ===\n\t\t\t"miss"\n\t\t) {\n'''
          if skip_marker not in part:
              raise SystemExit('skip event insertion marker missing')
          skip_block = '''\t\tif (\n\t\t\tevent.type ===\n\t\t\t"skip"\n\t\t) {\n\t\t\tmarkBatchPhaseSkipped(\n\t\t\t\tbatches,\n\t\t\t\tevent.batchId,\n\t\t\t\tString(event.phase ?? "H")\n\t\t\t);\n\n\t\t\tstats.suppressedHackChunks++;\n\t\t\tstats.pipeline.suppressedHackChunks++;\n\t\t\tstats.lastReason =\n\t\t\t\tString(event.reason ?? "H suppressed for local recovery");\n\t\t\tcontinue;\n\t\t}\n\n'''
          part = part.replace(skip_marker, skip_block + skip_marker, 1)

          # Non-H timing/state faults become local recovery requests.
          part = part.replace('"drain"', '"recover"')

          miss_return_marker = '''\t\t\tif (missedPhase === "H") {\n\t\t\t\t// A skipped hack leaves the target cleaner than planned. Let the\n\t\t\t\t// corresponding W/G/W phases finish; they safely over-recover.\n\t\t\t\tstats.lastReason = reason;\n\t\t\t\tcontinue;\n\t\t\t}\n\n\t\t\treturn {\n'''
          if miss_return_marker not in part:
              raise SystemExit('miss return marker missing')
          miss_replacement = '''\t\t\tif (missedPhase === "H") {\n\t\t\t\t// A skipped hack leaves the target cleaner than planned. Let the\n\t\t\t\t// corresponding W/G/W phases finish; they safely over-recover.\n\t\t\t\tstats.lastReason = reason;\n\t\t\t\tcontinue;\n\t\t\t}\n\n\t\t\tif (missedPhase === "W2") {\n\t\t\t\tstats.recovered++;\n\t\t\t\tbatches.delete(String(event.batchId));\n\t\t\t}\n\n\t\t\treturn {\n'''
          part = part.replace(miss_return_marker, miss_replacement, 1)

          part = part.replace(
              '''\t\t\tif (\n\t\t\t\tbatch.phases.H.skipped\n\t\t\t) {\n''',
              '''\t\t\tif (\n\t\t\t\tbatch.phases.H.skipped ||\n\t\t\t\tbatch.poisoned\n\t\t\t) {\n''',
              1,
          )

          text = text[:start] + part + text[end:]

          # Only the oldest unfinished batch can be the earliest overdue one.
          start = text.index('function findOverdueBatch(\n')
          end = text.index('function minimumSpacing(\n', start)
          old_find = text[start:end]
          new_find = '''function findOverdueBatch(\n\tbatches,\n\tcfg\n) {\n\tconst now = Date.now();\n\tconst grace = Math.max(250, cfg.gap * 3);\n\tconst first = batches.values().next();\n\n\tif (first.done) {\n\t\treturn null;\n\t}\n\n\tconst batch = first.value;\n\n\tfor (const phase of ["H", "W1", "G", "W2"]) {\n\t\tif (batch.phases[phase].complete) {\n\t\t\tcontinue;\n\t\t}\n\n\t\tif (now > batch.landing[phase] + grace) {\n\t\t\treturn `${phase} completion event overdue`;\n\t\t}\n\t}\n\n\treturn null;\n}\n\n'''
          text = text[:start] + new_find + text[end:]

          path.write_text(text)
          PY

      - name: Patch hack worker control gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/jit-hack.js')
          text = path.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '''\tconst maxLate = Number(ns.args[6] ?? 30);\n\n\tconst port = ns.getPortHandle(portNumber);\n''',
              '''\tconst maxLate = Number(ns.args[6] ?? 30);\n\tconst controlPortNumber = Number(ns.args[7] ?? 0);\n\n\tconst port = ns.getPortHandle(portNumber);\n\tconst controlPort =\n\t\tcontrolPortNumber > 0\n\t\t\t? ns.getPortHandle(controlPortNumber)\n\t\t\t: null;\n''',
              'hack control port args',
          )

          marker = '''\t\tif (untilCall < -maxLate) {\n'''
          gate = '''\t\tconst control =\n\t\t\tcontrolPort\n\t\t\t\t? controlPort.peek()\n\t\t\t\t: null;\n\n\t\tif (\n\t\t\tcontrol &&\n\t\t\ttypeof control === "object" &&\n\t\t\tcontrol.type === "jit-control" &&\n\t\t\tNumber(control.hackPauseUntil) >= landAt\n\t\t) {\n\t\t\tawait report(port, {\n\t\t\t\ttype: "skip",\n\t\t\t\tphase,\n\t\t\t\tbatchId,\n\t\t\t\tchunkId,\n\t\t\t\ttarget,\n\t\t\t\ttime: Date.now(),\n\t\t\t\treason:\n\t\t\t\t\t`H suppressed for recovery until ${Number(control.hackPauseUntil)}`,\n\t\t\t});\n\n\t\t\treturn;\n\t\t}\n\n'''
          replace_once(marker, gate + marker, 'hack pause gate')

          path.write_text(text)
          PY

      - name: Validate scripts
        shell: bash
        run: |
          cp src/daemon.js /tmp/daemon.mjs
          cp src/jit-hack.js /tmp/jit-hack.mjs
          node --check /tmp/daemon.mjs
          node --check /tmp/jit-hack.mjs
          git diff --check

      - name: Commit patch and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-nondestructive-recovery.yml
          git add src/daemon.js src/jit-hack.js
          git commit -m "Keep JIT income alive through isolated timing misses [skip ci]"
          git push origin HEAD:fix/non-destructive-recovery
