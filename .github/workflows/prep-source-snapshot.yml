name: Background prep source snapshot
on:
  push:
    branches: [feature/protected-background-prep]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@v4
        with:
          name: prep-source
          retention-days: 1
          path: |
            src
            test
            docs
            package.json
            package-lock.json
            filesync.json
