name: Patch JIT control port collision

on:
  push:
    branches: [fix/jit-control-port-collision]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch centralized ports
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ports = Path('src/lib/ports.js')
          text = ports.read_text()
          old = '\tPROGRESSION_STATUS: 16,\n'
          new = '\tPROGRESSION_STATUS: 16,\n\tJIT_CONTROL: 15,\n'
          if text.count(old) != 1:
              raise SystemExit('ports insertion point not found exactly once')
          ports.write_text(text.replace(old, new, 1))

          daemon = Path('src/daemon.js')
          text = daemon.read_text()

          if not text.startswith('const HOME = "home";'):
              raise SystemExit('unexpected daemon header')
          text = 'import { PORTS } from "lib/ports.js";\n\n' + text

          replacements = {
              '\t\t["port", 20],\n': '\t\t["port", PORTS.WORKER_EVENTS],\n',
              '\t\t["fleet-port", 19],\n': '\t\t["fleet-port", PORTS.FLEET_STATUS],\n',
              '\t\t["control-port", 18],\n': '\t\t["control-port", PORTS.JIT_CONTROL],\n',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'daemon replacement not found exactly once: {old!r}')
              text = text.replace(old, new, 1)

          daemon.write_text(text)
          PY

      - name: Validate scripts
        shell: bash
        run: |
          cp src/daemon.js /tmp/daemon.mjs
          cp src/lib/ports.js /tmp/ports.mjs
          node --check /tmp/daemon.mjs
          node --check /tmp/ports.mjs
          git diff --check

      - name: Commit fix and remove helper workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-jit-control-port.yml
          git add src/daemon.js src/lib/ports.js
          git commit -m "Separate JIT control and contract status ports [skip ci]"
          git push origin HEAD:fix/jit-control-port-collision
