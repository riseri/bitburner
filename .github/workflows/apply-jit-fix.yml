name: Apply verified JIT repair
on:
  push:
    branches: [fix/jit-recovery-invariants]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact tested source
        run: python3 .github/apply-jit.py
      - name: Regression tests
        run: node --test test/jit-recovery.test.cjs
      - name: Full daemon simulations
        run: node --test test/jit-simulation.test.cjs
      - name: Commit tested repair on the review branch
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/apply-jit.py .github/workflows/apply-jit-fix.yml
          git add src/daemon.js src/fleet-manager.js
          git commit -m 'Enforce JIT recovery and worker timing invariants [skip ci]'
          git push origin HEAD:fix/jit-recovery-invariants
