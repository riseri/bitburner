name: Two-target source snapshot
on:
  push:
    branches: [feature/two-target-jit]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.event.head_commit.message == 'Capture current source for two-target JIT validation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@v4
        with:
          name: multi-source
          path: |
            src
            test
            docs
            package.json
            package-lock.json
            filesync.json
            .github/workflows/jit-tests.yml
          include-hidden-files: true
          retention-days: 1
